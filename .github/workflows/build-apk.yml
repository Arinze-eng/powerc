name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.4"
          channel: 'stable'
      - run: flutter pub get
      - name: Patch incompatible dependency
        run: |
          find /home/runner/.pub-cache -name "layout_builder_baseline.dart" -exec sed -i 's/rebuildIfNecessary();//g' {} \;
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/apk/release/app-release.apk
